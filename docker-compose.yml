services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: permission-system-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  redis:
    image: redis:7-alpine
    container_name: permission-system-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: permission-system-rabbitmq
    profiles: ["mq"]
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_DEFAULT_VHOST:-/}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  permission-system-api:
    build:
      context: .
      dockerfile: backend/PermissionSystem.Api/Dockerfile
    container_name: permission-system-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      FileStorage__Provider: "${FILE_STORAGE_PROVIDER:-Local}"
      FileStorage__Local__RootPath: "/app/uploads"
      FileStorage__Minio__Endpoint: "${MINIO_ENDPOINT:-minio:9000}"
      FileStorage__Minio__AccessKey: "${MINIO_ROOT_USER:-}"
      FileStorage__Minio__SecretKey: "${MINIO_ROOT_PASSWORD:-}"
      FileStorage__Minio__BucketName: "${MINIO_BUCKET_NAME:-permission-system}"
      FileStorage__Minio__UseSsl: "${MINIO_USE_SSL:-false}"
      ConnectionStrings__DefaultConnection: "${SQLSERVER_CONNECTION_STRING}"
      Reports__ReportConnection: "${REPORT_CONNECTION_STRING:-}"
      Reports__SqlReportsEnabled: "${REPORTS_SQL_ENABLED:-false}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Provider: "Redis"
      Cache__EnableRedis: "true"
      Cache__DefaultExpirationMinutes: "30"
      Cache__KeyPrefix: "PermissionSystem:"
      RabbitMQ__Enabled: "${RABBITMQ_ENABLED:-false}"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "${RABBITMQ_DEFAULT_USER:-guest}"
      RabbitMQ__Password: "${RABBITMQ_DEFAULT_PASS}"
      RabbitMQ__VirtualHost: "${RABBITMQ_DEFAULT_VHOST:-/}"
      RabbitMQ__ExchangeName: "permission-system.exchange"
      RabbitMQ__NetworkRecoveryIntervalSeconds: "${RABBITMQ_NETWORK_RECOVERY_INTERVAL_SECONDS:-5}"
      RabbitMQ__PrefetchCount: "${RABBITMQ_PREFETCH_COUNT:-10}"
      RabbitMQ__ConsumerRetryCount: "${RABBITMQ_CONSUMER_RETRY_COUNT:-3}"
      RabbitMQ__ConsumerRetryDelaySeconds: "${RABBITMQ_CONSUMER_RETRY_DELAY_SECONDS:-5}"
      RabbitMQ__PublisherChannelPoolSize: "${RABBITMQ_PUBLISHER_CHANNEL_POOL_SIZE:-4}"
      RabbitMQ__EnablePublisherConfirms: "${RABBITMQ_ENABLE_PUBLISHER_CONFIRMS:-true}"
      RabbitMQ__EnableConsumers: "${RABBITMQ_ENABLE_CONSUMERS:-false}"
      RabbitMQ__EnableOutboxPublisher: "${RABBITMQ_ENABLE_OUTBOX_PUBLISHER:-false}"
      Notifications__DeliveryMode: "${NOTIFICATION_DELIVERY_MODE:-Direct}"
      OpenIddict__AccessTokenMinutes: "${OPENIDDICT_ACCESS_TOKEN_MINUTES:-60}"
      OpenIddict__RefreshTokenDays: "${OPENIDDICT_REFRESH_TOKEN_DAYS:-14}"
      Security__SystemConfigEncryptionKey: "${SYSTEM_CONFIG_ENCRYPTION_KEY}"
      SeedData__AdminPassword: "${SEED_ADMIN_PASSWORD}"
      SeedData__OAuthClientSecret: "${SEED_OAUTH_CLIENT_SECRET}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - permission-system

  minio:
    image: minio/minio:latest
    container_name: permission-system-minio
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - permission-system

  minio-init:
    image: minio/mc:latest
    container_name: permission-system-minio-init
    profiles: ["object-storage"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-permission-system}"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"
    networks:
      - permission-system

  permission-system-worker:
    build:
      context: .
      dockerfile: backend/PermissionSystem.Worker/Dockerfile
    container_name: permission-system-worker
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Docker
      FileStorage__Provider: "${FILE_STORAGE_PROVIDER:-Local}"
      FileStorage__Local__RootPath: "/app/uploads"
      FileStorage__Minio__Endpoint: "${MINIO_ENDPOINT:-minio:9000}"
      FileStorage__Minio__AccessKey: "${MINIO_ROOT_USER:-}"
      FileStorage__Minio__SecretKey: "${MINIO_ROOT_PASSWORD:-}"
      FileStorage__Minio__BucketName: "${MINIO_BUCKET_NAME:-permission-system}"
      FileStorage__Minio__UseSsl: "${MINIO_USE_SSL:-false}"
      ConnectionStrings__DefaultConnection: "${SQLSERVER_CONNECTION_STRING}"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Provider: "Redis"
      Cache__EnableRedis: "true"
      Cache__DefaultExpirationMinutes: "30"
      Cache__KeyPrefix: "PermissionSystem:"
      RabbitMQ__Enabled: "${RABBITMQ_ENABLED:-false}"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: "${RABBITMQ_DEFAULT_USER:-guest}"
      RabbitMQ__Password: "${RABBITMQ_DEFAULT_PASS}"
      RabbitMQ__VirtualHost: "${RABBITMQ_DEFAULT_VHOST:-/}"
      RabbitMQ__ExchangeName: "permission-system.exchange"
      RabbitMQ__NetworkRecoveryIntervalSeconds: "${RABBITMQ_NETWORK_RECOVERY_INTERVAL_SECONDS:-5}"
      RabbitMQ__PrefetchCount: "${RABBITMQ_PREFETCH_COUNT:-10}"
      RabbitMQ__ConsumerRetryCount: "${RABBITMQ_CONSUMER_RETRY_COUNT:-3}"
      RabbitMQ__ConsumerRetryDelaySeconds: "${RABBITMQ_CONSUMER_RETRY_DELAY_SECONDS:-5}"
      RabbitMQ__PublisherChannelPoolSize: "${RABBITMQ_PUBLISHER_CHANNEL_POOL_SIZE:-4}"
      RabbitMQ__EnablePublisherConfirms: "${RABBITMQ_ENABLE_PUBLISHER_CONFIRMS:-true}"
      RabbitMQ__EnableConsumers: "${RABBITMQ_ENABLE_CONSUMERS:-false}"
      RabbitMQ__EnableOutboxPublisher: "${RABBITMQ_ENABLE_OUTBOX_PUBLISHER:-false}"
      Notifications__DeliveryMode: "${NOTIFICATION_DELIVERY_MODE:-Direct}"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - permission-system

  permission-admin:
    build:
      context: .
      dockerfile: frontend/permission-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_OAUTH_CLIENT_ID: "${VITE_OAUTH_CLIENT_ID:-permission-admin}"
        VITE_OAUTH_CLIENT_SECRET: "${VITE_OAUTH_CLIENT_SECRET}"
    container_name: permission-admin
    depends_on:
      permission-system-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      permission-system:
        ipv4_address: 172.28.0.10

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
  minio_data:

networks:
  permission-system:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
