services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: permission-system-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  redis:
    image: redis:7-alpine
    container_name: permission-system-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: permission-system-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_DEFAULT_VHOST:-/}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - permission-system

  permission-system-api:
    build:
      context: .
      dockerfile: backend/PermissionSystem.Api/Dockerfile
    container_name: permission-system-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-PermissionSystemDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_DEFAULT_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:-guest}"
      RabbitMq__VirtualHost: "${RABBITMQ_DEFAULT_VHOST:-/}"
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-8080}"
      OpenIddict__AccessTokenMinutes: "${OPENIDDICT_ACCESS_TOKEN_MINUTES:-60}"
      OpenIddict__RefreshTokenDays: "${OPENIDDICT_REFRESH_TOKEN_DAYS:-14}"
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - permission-system

  permission-system-worker:
    build:
      context: .
      dockerfile: backend/PermissionSystem.Worker/Dockerfile
    container_name: permission-system-worker
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-PermissionSystemDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_DEFAULT_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:-guest}"
      RabbitMq__VirtualHost: "${RABBITMQ_DEFAULT_VHOST:-/}"
    networks:
      - permission-system

  permission-admin:
    build:
      context: .
      dockerfile: frontend/permission-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_OAUTH_CLIENT_ID: "${VITE_OAUTH_CLIENT_ID:-permission-admin}"
        VITE_OAUTH_CLIENT_SECRET: "${VITE_OAUTH_CLIENT_SECRET:-permission-admin-secret}"
    container_name: permission-admin
    depends_on:
      - permission-system-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - permission-system

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:

networks:
  permission-system:
    driver: bridge
